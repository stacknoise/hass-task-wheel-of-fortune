version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, backend]
    ignore:
      # von pytest-homeassistant-custom-component fest gepinnt, wird mit diesem Paket mitgezogen
      - dependency-name: pytest-cov
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: [dependencies, frontend]
    ignore:
      # typescript-eslint unterstützt noch kein TypeScript 7; @types/node folgt der Node-Version (22)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    labels: [dependencies, e2e]
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [github-actions]
    groups:
      actions:
        patterns: ["*"]
