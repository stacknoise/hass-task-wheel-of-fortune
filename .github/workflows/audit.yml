name: Audit
# Wöchentliche Prüfung der Abhängigkeiten auf neue Advisories, auch ohne Codeänderung
# (der Job `audit` in ci.yml läuft nur bei Push und Pull Request).
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: e2e
  pip:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            e2e/requirements.txt
      # die installierte Umgebung prüfen, damit auch die von Home Assistant nachgezogenen Pakete erfasst sind
      - run: pip install -r requirements-dev.txt -r e2e/requirements.txt "pip-audit==2.9.0"
      - run: pip-audit
