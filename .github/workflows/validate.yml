name: Validate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master (kein Release-Tag; Dependabot hebt den SHA an)
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
