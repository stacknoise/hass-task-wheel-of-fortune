<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glücksrad – Auslosung: Rubbellose + 4 neue Ideen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#f2f4f7;--ink:#1f2328;--mut:#5a616b;--line:#e3e6ea;--blue:#0262a0;--blue-d:#01497a;--stage:#10243a;--gold:#f5c542}
body{margin:0;background:var(--bg);font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
button,select{font-family:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none !important}

/* Kopf */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 24px}
.top-row h1{margin:0;font-size:22px;font-weight:400;flex:1 1 auto}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px}
.tabs a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;text-decoration:none;font-size:14px;font-weight:500;color:var(--mut);border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--blue);border-bottom-color:var(--blue)}
.btn-ghost{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid #c4c9d0;background:#fff;color:var(--blue);font:500 14px Roboto,system-ui,sans-serif;cursor:pointer}
.btn-ghost:hover{background:#eef6fc}
.btn-primary{min-height:44px;padding:0 22px;border-radius:22px;border:none;background:var(--blue);color:#fff;font:500 15px Roboto,system-ui,sans-serif;cursor:pointer}
.btn-primary:hover{background:var(--blue-d)}

/* Ideen-Umschalter */
.ideas{max-width:1200px;margin:0 auto;padding:16px 24px 0;width:100%}
.ideas-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ideas-lbl{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid #c4c9d0;background:#fff;color:var(--ink);font:500 14px Roboto,system-ui,sans-serif;cursor:pointer}
.seg button .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#e3e6ea;font-size:12px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button[aria-pressed="true"] .n{background:#fff;color:var(--blue)}
.idea-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 24px;font-size:14px;line-height:1.5}
.idea-info h2{margin:0 0 4px;font-size:18px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.effort{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:12px;background:#dcecf8;color:var(--blue-d);font-size:12px;font-weight:700}
.idea-info p{margin:0}
.idea-info .k{font-weight:700}
.idea-info .rm{color:var(--mut);font-size:13px}
.sim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.sim input{width:20px;height:20px}

/* Seite */
.page{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;max-width:1200px;margin:0 auto;width:100%}
.side{flex:1 1 260px;max-width:320px;background:#fff;border-radius:12px;border:1px solid var(--line);padding:8px 0}
.side .pad{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.side label{font-size:12px;color:var(--mut);font-weight:500}
.side select{min-height:44px;padding:0 12px;border:1px solid #c4c9d0;border-radius:8px;background:#fff;color:var(--ink);font:500 15px Roboto,system-ui,sans-serif;cursor:pointer;width:100%}
.hint{font-size:12px;color:var(--mut)}
.side h2{margin:4px 0 0;font-size:18px;font-weight:500}
.side .sub{font-size:13px;color:var(--mut);margin-top:-8px}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid #eef0f3}
.rrow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rrow .m{flex:1 1 auto;display:flex;flex-direction:column;gap:2px;min-width:0}
.rrow .t{font-size:15px;font-weight:500}
.rrow .r{font-size:12px;color:var(--mut)}
.rrow .s{font-size:13px;font-weight:500}
.side .foot{padding:12px 20px;border-top:1px solid #eef0f3}
.side .foot .btn-ghost{width:100%;justify-content:center}

/* Bühne */
.stage{flex:999 1 520px;min-width:0;background:var(--stage);border-radius:16px;padding:24px;color:#fff;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage-head{flex:1 1 100%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stage-head .l{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9fc4e4;font-weight:500}
.stage-head .tn{font-size:30px;font-weight:900;overflow-wrap:anywhere}
.viz-col{flex:1 1 300px;max-width:460px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:16px}
.viz{width:100%}
.start{min-height:52px;padding:0 28px;border-radius:26px;border:3px solid #fff;background:var(--blue);color:#fff;font:900 17px Roboto,system-ui,sans-serif;letter-spacing:.03em;cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.start:disabled{background:#3a556f;animation:none;cursor:default}
.start:hover:not(:disabled){background:var(--blue-d)}
.who{flex:1 1 220px;max-width:280px;display:flex;flex-direction:column;gap:10px}
.who h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9fc4e4;font-weight:500}
.who .p{display:flex;align-items:center;gap:10px}
.who .p.out{opacity:.7}
.who .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;border:2px solid #fff}
.who .nm{font-size:14px;font-weight:500}
.who .nt{font-size:12px;color:#c9dcec}
.who .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:3px;width:100%;overflow:hidden}
.who .bar i{display:block;height:100%;background:#9fc4e4}
.who .legend{font-size:12px;color:#c9dcec;line-height:1.5;padding-top:6px}
.banner{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;background:#fff;color:var(--ink);border-radius:12px;padding:16px 20px;animation:pop .5s ease-out both;position:relative}
.banner .badge{width:56px;height:56px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font:900 24px Roboto,system-ui,sans-serif}
.banner .btxt{display:flex;flex-direction:column;gap:2px;flex:1 1 200px;min-width:0}
.banner .bt{font-size:22px;font-weight:900;overflow-wrap:anywhere}
.banner .bd{font-size:13px;color:var(--mut)}
.done{position:absolute;inset:0;background:rgba(16,36,58,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;animation:pop .4s ease-out both;text-align:center}
.done .l{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#9fc4e4;font-weight:500}
.done .big{font-size:30px;font-weight:900}
.done .list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}
.done .li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;font-size:15px;text-align:left}
.done .li b{font-weight:700}
.done .note{font-size:13px;color:#c9dcec}
.done .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn-out{min-height:44px;padding:0 20px;border-radius:22px;border:1px solid #9fc4e4;background:transparent;color:#fff;font:500 15px Roboto,system-ui,sans-serif;cursor:pointer}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,166,232,.6)}50%{box-shadow:0 0 0 14px rgba(79,166,232,0)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

/* gemeinsame SVG-Texte */
.svg{display:block;width:100%;height:auto;overflow:visible}
.svg text{font-family:Roboto,system-ui,sans-serif}

/* Idee B: Krallenautomat, Idee C: Ballons, Idee E: Kartoffel (SVG) */
.cab{fill:#0a1624;stroke:#9fc4e4;stroke-width:3}
.cap-t{font-weight:900;fill:#fff;text-anchor:middle;pointer-events:none}
.cap-p{font-weight:500;fill:#fff;text-anchor:middle;pointer-events:none}
.bob{animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.glow{filter:drop-shadow(0 0 10px #f5c542) drop-shadow(0 0 20px rgba(245,197,66,.7))}
.dim{opacity:.35}
.spark{animation:blink .25s steps(2) infinite}

/* Rubbellose (Chance-Hinweis) + Zeitung */
.scr{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;width:100%}
.sc{position:relative;height:104px;border-radius:12px;overflow:hidden;background:#fff;color:var(--ink);border:3px solid var(--c);touch-action:none;user-select:none}
.sc .under{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:4px}
.sc .under b{font-size:17px;font-weight:900;color:var(--c)}
.sc .under span{font-size:12px;color:var(--mut)}
.sc.win .under{background:linear-gradient(135deg,#fff6d6,#ffe08a)}
.sc.win.rev{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(245,197,66,.7)}
.sc.lose .under{background:#eef0f3}
.sc.lose.rev{opacity:.55}
.sc canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;transition:opacity calc(.3s / var(--spd,1))}
.sc canvas.gone{opacity:0;pointer-events:none}
.scr-note{text-align:center;font-size:12px;color:#c9dcec;margin-top:8px}
.news{position:relative;height:290px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.paper{position:relative;width:250px;min-height:210px;background:#f6f1e3;color:#1f2328;border-radius:6px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.5);--c:#1f2328;will-change:transform}
.paper .mast{font:900 22px Georgia,serif;text-align:center;letter-spacing:.08em}
.paper .rule{height:3px;background:#1f2328;margin:4px 0 10px;box-shadow:0 4px 0 #1f2328}
.paper .head{font:900 22px/1.15 Georgia,serif;color:var(--c);overflow-wrap:anywhere}
.paper .sub{font-size:12px;color:#5a616b;margin-top:8px}
.paper .lines{margin-top:12px;display:flex;flex-direction:column;gap:5px}
.paper .lines i{display:block;height:5px;border-radius:2px;background:#d9d2bd}
.paper .stamp{position:absolute;right:10px;bottom:12px;border:4px solid #d32f2f;color:#d32f2f;font:900 24px Roboto,sans-serif;padding:0 8px;border-radius:6px;transform:rotate(-14deg) scale(2.2);opacity:0;transition:transform .18s ease-in,opacity .18s}
.paper .stamp.on{transform:rotate(-14deg) scale(1);opacity:1}

@media (max-width:640px){
  .top-row,.ideas,.page{padding-left:16px;padding-right:16px}
  .page{padding-top:16px}
  .stage{padding:16px;gap:16px}
  .stage-head .tn{font-size:24px}
  .side{max-width:none}
  .banner .bt{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Aufgaben-Glücksrad <span class="hint" style="font-size:14px">· Mockup: Rubbellose + 4 neue Ideen</span></h1>
    <button type="button" class="btn-ghost" id="restart">Runde neu starten</button>
  </div>
  <nav class="tabs" aria-label="Bereiche">
    <a href="Main.dc.html">Übersicht</a>
    <a href="Auslosung.dc.html" aria-current="page">Auslosung</a>
    <a href="Aufgaben.dc.html">Aufgaben</a>
    <a href="Personen.dc.html">Personen</a>
    <a href="Zeitplan.dc.html">Zeitpläne</a>
    <a href="Historie.dc.html">Historie</a>
    <a href="Statistik.dc.html">Statistik</a>
  </nav>
</header>

<section class="ideas" aria-label="Animationsvarianten">
  <div class="ideas-card">
    <span class="ideas-lbl" id="ideasLbl">Animationsidee wählen (Runde startet bei Wechsel neu)</span>
    <div class="seg" id="seg" role="group" aria-labelledby="ideasLbl"></div>
    <div class="idea-info" id="info"></div>
    <label class="sim"><input type="checkbox" id="sim"> Reduzierte Bewegung simulieren (wie <code>prefers-reduced-motion: reduce</code>)</label>
  </div>
</section>

<main class="page">
  <section class="side" aria-label="Zeitplan und Runde">
    <div class="pad">
      <label for="plan">Welcher Zeitplan wird ausgelöst?</label>
      <select id="plan"></select>
      <span class="hint" id="planHint"></span>
      <h2 id="planName"></h2>
      <span class="sub" id="planSub"></span>
    </div>
    <div id="round"></div>
    <div class="foot"><button type="button" class="btn-ghost" id="drawAll">Rest ohne Animation verlosen</button></div>
  </section>

  <section class="stage" id="stage" aria-label="Bühne">
    <div class="stage-head"><span class="l" id="stepLbl"></span><span class="tn" id="taskName"></span></div>
    <div class="viz-col">
      <div class="viz" id="viz"></div>
      <button type="button" class="start" id="start"></button>
    </div>
    <div class="who" id="who"></div>
    <div id="sr" class="sr" aria-live="polite" aria-atomic="true"></div>
    <div class="banner" id="banner" hidden>
      <div class="badge" id="bBadge" aria-hidden="true"></div>
      <div class="btxt"><span class="bt" id="bTitle"></span><span class="bd" id="bDetail"></span></div>
      <button type="button" class="btn-primary" id="nextBtn"></button>
    </div>
    <div class="done" id="done" hidden>
      <span class="l">Runde abgeschlossen</span>
      <span class="big">Alle Aufgaben sind verteilt</span>
      <div class="list" id="doneList"></div>
      <span class="note">Gespeichert in der Historie · Push-Benachrichtigung an alle verschickt</span>
      <div class="btns">
        <button type="button" class="btn-out" id="again">Nochmal von vorn</button>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
'use strict';

/* ---------- Beispieldaten (identisch zum Glücksrad-Mockup) ---------- */
var P = {
  A: { name: 'Anna', color: '#c05600' }, B: { name: 'Ben', color: '#1a5fd0' }, C: { name: 'Clara', color: '#137333' },
  D: { name: 'David', color: '#7b2cbf' }, E: { name: 'Emma', color: '#b0136f' }
};
var TASKS = [
  { task: 'Bad putzen', rule: 'Nur Anna, Ben, Clara, David · max. 1× in 2 Wochen pro Person',
    wheel: [['A', 30], ['B', 34], ['D', 36]],
    out: { C: 'Pause – hatte die Aufgabe letzte Woche', E: 'Nicht erlaubt für diese Aufgabe' } },
  { task: 'Müll rausbringen', rule: 'Alle · 1× pro Woche',
    wheel: [['A', 22], ['B', 22], ['C', 20], ['E', 36]],
    out: { D: 'Abwesend (Urlaub bis 12.11.)' } },
  { task: 'Rasen mähen', rule: 'Nur Ben, Clara, David · alle 2 Wochen ± 1 Tag',
    wheel: [['B', 45], ['C', 55]],
    out: { A: 'Nicht erlaubt für diese Aufgabe', D: 'Abwesend (Urlaub bis 12.11.)', E: 'Nicht erlaubt für diese Aufgabe' } },
  { task: 'Staubsaugen Wohnzimmer', rule: 'Alle · max. 2× pro Woche',
    wheel: [['A', 24], ['B', 26], ['C', 18], ['E', 32]],
    out: { D: 'Abwesend (Urlaub bis 12.11.)' } },
  { task: 'Spülmaschine ausräumen', rule: 'Alle · jede Runde',
    wheel: [['A', 22], ['B', 24], ['C', 20], ['E', 34]],
    out: { D: 'Abwesend (Urlaub bis 12.11.)' } }
];
var PLANS = [
  { name: 'Wochenplan', tasks: [0, 1, 2, 3], hint: 'Automatisch jeden Montag 07:00 · jetzt vorzeitig manuell auslösen', mode: 'automatisch' },
  { name: 'Täglich morgens', tasks: [4], hint: 'Automatisch täglich 06:30 · jetzt vorzeitig manuell auslösen', mode: 'automatisch' },
  { name: 'Großputz', tasks: [0, 1, 3], hint: 'Nur manuell · zuletzt ausgelost Sa, 10. Okt', mode: 'nur manuell' },
  { name: 'Vor dem Weihnachtsbesuch', tasks: [0, 1, 3], hint: 'Einmalig am Sa, 19. Dez · jetzt vorzeitig manuell auslösen', mode: 'einmalig' },
  { name: 'Garten (Sommer)', tasks: [2], hint: 'Pausiert · manuell trotzdem möglich', mode: 'pausiert' }
];

/* ---------- Hilfen ---------- */
function $(id) { return document.getElementById(id); }
function speed() { return window.__speed > 0 ? window.__speed : 1; }
function D(ms) { return ms / speed(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInOut(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function shuffled(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function reduced() {
  var m = false;
  try { m = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  return m || $('sim').checked;
}
function Tok() { this.dead = false; this.timers = []; this.raf = 0; }
Tok.prototype.cancel = function () { this.dead = true; cancelAnimationFrame(this.raf); this.timers.forEach(clearTimeout); };
function sleep(ms, tok) {
  return new Promise(function (res) {
    tok.timers.push(setTimeout(function () { if (!tok.dead) res(); }, D(ms)));
  });
}
/* fn(t 0..1, dtMs echte Zeit) */
function frames(dur, tok, fn) {
  return new Promise(function (res) {
    var t0 = null, last = null;
    function step(ts) {
      if (tok.dead) return;
      if (t0 === null) { t0 = ts; last = ts; }
      var t = Math.min(1, (ts - t0) / D(dur));
      fn(t, ts - last); last = ts;
      if (t < 1) tok.raf = requestAnimationFrame(step); else res();
    }
    tok.raf = requestAnimationFrame(step);
  });
}
function entriesFor(task) {
  var total = task.wheel.reduce(function (s, w) { return s + w[1]; }, 0);
  return task.wheel.map(function (w) {
    return { k: w[0], name: P[w[0]].name, color: P[w[0]].color, w: w[1], pct: Math.round(w[1] / total * 100), share: w[1] / total };
  });
}
/* Gewichteter Zufall – simuliert das Backend. Danach ist das Ergebnis fix. */
function pickWinner(entries) {
  var u = Math.random(), acc = 0;
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (u < acc + e.share || i === entries.length - 1) {
      return { i: i, key: e.k, u: u, frac: Math.min(.999, Math.max(0, (u - acc) / e.share)), entries: entries };
    }
    acc += e.share;
  }
}
function cum(entries) { var a = 0; return entries.map(function (e) { var s = a; a += e.share; return s; }); }
function keyAt(entries, pos) { /* pos 0..1 */
  var a = 0;
  for (var i = 0; i < entries.length; i++) { a += entries[i].share; if (pos < a - 1e-9) return entries[i].k; }
  return entries[entries.length - 1].k;
}

/* ---------- gemeinsame Helfer der neuen Ideen ---------- */
var NS = 'http://www.w3.org/2000/svg';
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
/* Zwischenwert 0..1 mit Easing, wartet bis zum Ende */
function tween(dur, tok, fn, ease) { return frames(dur, tok, function (t) { fn((ease || easeInOut)(t)); }); }
/* Radius ~ Wurzel der Chance (Fläche = Chance), begrenzt auf die Breite */
function radii(ents, rmax, floor) {
  var mx = Math.max.apply(null, ents.map(function (e) { return e.share; }));
  return ents.map(function (e) { return rmax * Math.max(floor || .5, Math.sqrt(e.share / mx)); });
}
function svgOpen(w, h, label) { return '<svg class="svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label) + '">'; }
function chain(tok, steps) { /* Schritte nacheinander (jeder liefert ein Promise) */
  return steps.reduce(function (p, s) { return p.then(function () { return tok.dead ? null : s(); }); }, Promise.resolve());
}

/* ---------- Idee 1: Rubbellose (manuell + automatisch) ---------- */
var SCRATCH = {
  id: 'scratch', name: 'Rubbellose', effort: 'M', btn: 'Automatisch rubbeln',

    viz.innerHTML = h; this.ents = ents; this.fx = $('h-fx');
  },
  pose: function (i, x, y, rot, s, op) { var g = $('h-s' + i); g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + rot.toFixed(1) + ') scale(' + s.toFixed(3) + ')'); g.setAttribute('opacity', op); },
  top: function (plan) { var self = this; this.ents.forEach(function (_, i) { $('h-s' + i).setAttribute('class', i === plan.i ? 'glow' : ''); if (i !== plan.i) $('h-s' + i).setAttribute('opacity', '0'); }); this.pose(plan.i, 170, 96, 0, 1.55, 1); return this.ents[plan.i].k; },
  run: function (plan, tok) {
    var self = this, w = plan.i, n = this.ents.length, sl = this.sl, steps = [];
    steps.push(function () { return sleep(250, tok); });
    steps.push(function () { /* Fontäne */
      return frames(1500, tok, function (t) { sl.forEach(function (s, i) {
        var u = (t - s.st) / .5; if (u < 0 || u > 1) { if (u > 1) self.pose(i, 170, 240, 0, .2, 0); return; }
        self.pose(i, 170 + s.dx * u, 235 - s.H * 4 * u * (1 - u) * 1.25 - (1 - u) * 0, s.rot * Math.sin(Math.PI * u * 2), .5 + .5 * Math.sin(Math.PI * u), 1);
      }); });
    });
    steps.push(function () { var s = sl[w]; return tween(750, tok, function (e) { self.pose(w, lerp(170, 170, e), lerp(235, 96, e), 360 * (1 - e) * (s.rot > 0 ? 1 : -1) * 0 + s.rot * (1 - e), lerp(.5, 1.55, e), 1); }, easeOut); });
    steps.push(function () { return tween(450, tok, function (e) { $('h-hat').setAttribute('transform', 'translate(170 ' + (250 + 6 * Math.sin(Math.PI * e)).toFixed(1) + ')'); }); });
    steps.push(function () { self.top(plan); return sleep(400, tok); });
    return chain(tok, steps).then(function () { return tok.dead ? null : self.ents[w].k; });
  },
  final: function (plan) { return this.top(plan); }
};

var IDEAS = [SCRATCH, OSCAR, GOAL, NEWS, HAT];


/* ---------- Zustand ---------- */
var state = { idea: 0, plan: 0, idx: 0, phase: 'ready', results: {} };
var tok = new Tok();
var cur = null; /* laufende Auslosung */
var pre = null; /* vorab bestimmtes Ergebnis der aktuellen Aufgabe */
function getPlan() { if (!pre) pre = pickWinner(entriesFor(curTask())); return pre; }
try { var hv = parseInt((location.hash || '').replace('#', ''), 10); if (hv >= 1 && hv <= 5) state.idea = hv - 1; } catch (e) {}

function curTasks() { return PLANS[state.plan].tasks.map(function (i) { return TASKS[i]; }); }
function curTask() { return curTasks()[state.idx]; }

function renderBar() {
  var seg = $('seg'); seg.innerHTML = '';
  IDEAS.forEach(function (it, i) {
    var b = document.createElement('button'); b.type = 'button'; b.id = 'idea-' + (i + 1);
    b.setAttribute('aria-pressed', i === state.idea ? 'true' : 'false');
    b.innerHTML = '<span class="n">' + (i + 1) + '</span>' + esc(it.name);
    b.addEventListener('click', function () { if (state.idea === i) return; state.idea = i; try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {} renderBar(); restart(); });
    seg.appendChild(b);
  });
  var it = IDEAS[state.idea];
  $('info').innerHTML =
    '<div><h2>' + (state.idea + 1) + '. ' + esc(it.name) + ' <span class="effort" title="S = klein, M = mittel, L = groß">Aufwand ' + it.effort + '</span></h2><p>' + esc(it.desc) + '</p></div>' +
    '<div><p><span class="k">Stärke:</span> ' + esc(it.pro) + '</p><p><span class="k">Schwäche:</span> ' + esc(it.con) + '</p>' +
    '<p class="rm"><span class="k">Reduzierte Bewegung:</span> Bei <code>prefers-reduced-motion</code> entfällt jede Bewegung, das Ergebnis erscheint sofort im Endzustand.</p></div>';
}

function mountViz() {
  tok.cancel(); tok = new Tok(); cur = null; pre = null;
  var viz = $('viz'); viz.innerHTML = ''; viz.style.removeProperty('--spd');
  IDEAS[state.idea].mount(viz, { entries: entriesFor(curTask()), task: curTask(), getPlan: getPlan, complete: manualDone });
}

function renderSide() {
  var plan = PLANS[state.plan], tasks = curTasks(), done = Object.keys(state.results).length;
  $('planHint').textContent = plan.hint; $('planName').textContent = 'Runde „' + plan.name + '“';
  $('planSub').textContent = 'Manuell gestartet · ' + done + ' von ' + tasks.length + ' verlost';
  $('round').innerHTML = tasks.map(function (x, i) {
    var res = state.results[i], active = i === state.idx && state.phase !== 'done';
    var st = res ? P[res].name : (active ? (state.phase === 'spinning' ? 'läuft …' : 'als Nächstes') : 'offen');
    var fg = res ? '#0f5c28' : (active ? '#0262a0' : '#5a616b'), dot = res ? P[res].color : (active ? '#0262a0' : '#c4c9d0');
    return '<div class="rrow" style="background:' + (active ? '#eef6fc' : 'transparent') + '"><div class="dot" style="background:' + dot + '"></div><div class="m"><span class="t">' + esc(x.task) + '</span><span class="r">' + esc(x.rule) + '</span></div><span class="s" style="color:' + fg + '">' + esc(st) + '</span></div>';
  }).join('');
}

function renderStage() {
  var tasks = curTasks(), t = curTask(), ents = entriesFor(t), inW = {};
  ents.forEach(function (e) { inW[e.k] = e.pct; });
  $('stepLbl').textContent = 'Aufgabe ' + (state.idx + 1) + ' von ' + tasks.length;
  $('taskName').textContent = t.task;
  $('who').innerHTML = '<h3>Wer ist dabei?</h3>' + ['A', 'B', 'C', 'D', 'E'].map(function (k) {
    var on = inW[k] !== undefined;
    return '<div class="p' + (on ? '' : ' out') + '"><div class="av" style="background:' + P[k].color + '" aria-hidden="true">' + P[k].name.charAt(0) + '</div><div style="flex:1 1 auto;min-width:0"><div class="nm">' + P[k].name + '</div><div class="nt">' + (on ? 'Chance ' + inW[k] + ' %' : 'Ausgeschlossen: ' + esc(t.out[k])) + '</div>' + (on ? '<div class="bar"><i style="width:' + inW[k] + '%"></i></div>' : '') + '</div></div>';
  }).join('') + '<span class="legend">Größe = Chance. Wer im letzten Monat weniger Punkte gesammelt hat, bekommt ein größeres Stück.</span>';
  var s = $('start'), it = IDEAS[state.idea];
  s.textContent = state.phase === 'spinning' ? 'Läuft …' : (state.phase === 'result' ? 'Gelost' : it.btn);
  s.disabled = state.phase !== 'ready';
  $('stage').setAttribute('aria-busy', state.phase === 'spinning' ? 'true' : 'false');
  var win = state.results[state.idx], banner = $('banner');
  banner.hidden = !(state.phase === 'result' && win);
  if (!banner.hidden) {
    var isLast = state.idx === tasks.length - 1;
    $('bBadge').style.background = P[win].color; $('bBadge').textContent = P[win].name.charAt(0);
    $('bTitle').textContent = P[win].name + ' übernimmt ' + t.task;
    $('bDetail').textContent = 'Chance war ' + inW[win] + ' % · fällig bis Sonntag, 15. November · +' + (state.idx === 0 ? 5 : 3) + ' Punkte';
    $('nextBtn').textContent = isLast ? 'Runde abschließen' : 'Nächste Aufgabe';
  }
  var dn = $('done'); dn.hidden = state.phase !== 'done';
  $('doneList').innerHTML = tasks.map(function (x, i) { return '<div class="li"><span>' + esc(x.task) + '</span><b>' + (state.results[i] ? P[state.results[i]].name : 'nicht verteilt') + '</b></div>'; }).join('');
}

function update() { renderSide(); renderStage(); }

function restart() {
  tok.cancel(); state.idx = 0; state.phase = 'ready'; state.results = {};
  $('sr').textContent = '';
  mountViz(); update();
}

function finishWith(plan, landed) {
  window.__lastLanded = landed;
  if (landed !== plan.key) console.error('Animation endet bei ' + landed + ', Ziel war ' + plan.key);
  state.results[state.idx] = plan.key; state.phase = 'result'; pre = null;
  window.__lastWinner = plan.key;
  update();
  $('sr').textContent = P[plan.key].name + ' übernimmt ' + curTask().task + '. Chance war ' + plan.entries[plan.i].pct + ' Prozent.';
  try { $('nextBtn').focus({ preventScroll: true }); } catch (e) {}
}
/* Alle Lose von Hand aufgerubbelt */
function manualDone(plan) {
  if (state.phase === 'result' || state.phase === 'done') return;
  tok.cancel(); tok = new Tok(); window.__lastTarget = plan.key; finishWith(plan, plan.key);
}
function start() {
  if (state.phase !== 'ready') return;
  var idea = IDEAS[state.idea], plan = getPlan();
  window.__lastTarget = plan.key; window.__lastWinner = null; window.__lastLanded = null;
  state.phase = 'spinning'; update();
  var myTok = tok;
  if (reduced()) { finishWith(plan, idea.final(plan)); return; }
  idea.run(plan, myTok).then(function (landed) { if (!myTok.dead) finishWith(plan, landed); });
}

function next() {
  var tasks = curTasks();
  if (state.idx >= tasks.length - 1) { state.phase = 'done'; update(); $('again').focus(); return; }
  state.idx++; state.phase = 'ready'; $('sr').textContent = '';
  mountViz(); update();
  try { $('start').focus({ preventScroll: true }); } catch (e) {}
}

function drawAll() {
  tok.cancel();
  curTasks().forEach(function (t, i) { if (!state.results[i]) state.results[i] = pickWinner(entriesFor(t)).key; });
  state.phase = 'done'; update(); $('again').focus();
}

/* ---------- Start ---------- */
$('plan').innerHTML = PLANS.map(function (p, i) { return '<option value="' + i + '">' + esc(p.name) + ' · ' + esc(p.mode) + '</option>'; }).join('');
$('plan').addEventListener('change', function (e) { state.plan = parseInt(e.target.value, 10) || 0; restart(); });
$('start').addEventListener('click', start);
$('nextBtn').addEventListener('click', next);
$('drawAll').addEventListener('click', drawAll);
$('restart').addEventListener('click', restart);
$('again').addEventListener('click', restart);
renderBar(); restart();
})();
</script>
</body>
</html>
