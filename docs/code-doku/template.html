<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__ Code-Dokumentation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Code-Dokumentation, Vorlage Schema 2 (Leitfaden Code-Dokumentation). Kopfzeile mit Tabs, darunter Explorer (Baum | Details | Quelltext) oder Abhängigkeitskarte. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#eaeee8; --ink:#16251d; --muted:#586860; --line:#d5ddd4;
  --accent:#1d774d; --on-accent:#ffffff; --yellow:#f1c000;
  --imp:#d4690f; --use:#1d774d; --ok:#2e8b57; --warn:#b98a00; --bad:#c1412f;
  --code-bg:#fbfcfa; --sk:#7a3a9e; --ss:#a8431b; --sc:#66766c; --sn:#1d65a0; --st:#1d774d;
  --hl-t:#eef4ea; --hl-m:#fff1b8;
  --f-d:'Barlow',system-ui,sans-serif; --f-b:'Inter',system-ui,sans-serif; --f-m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --l0:#1d774d; --l1:#2c6fa3; --l2:#8553ad; --l3:#b8741a; --l4:#17878c; --l5:#6f777d; --l6:#a8431b; --l7:#4b5bbd;
  --k-prop:#2c6fa3; --k-field:#6f777d; --k-const:#8553ad; --k-event:#b8741a; --k-meth:#1d774d; --k-ctor:#17878c;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#16211b; --surface2:#1f2d25; --ink:#e5eee8; --muted:#94a69b; --line:#2b3b32;
  --accent:#4fbf89; --on-accent:#0b1410; --imp:#f0913f; --use:#4fbf89; --ok:#4fbf89; --warn:#e3b72b; --bad:#ef7a68;
  --code-bg:#121b16; --sk:#c39be0; --ss:#f0a07c; --sc:#7f9186; --sn:#7fb8e8; --st:#6fd3a0;
  --hl-t:#1a2a21; --hl-m:#4a4210;
  --l0:#4fbf89; --l1:#6aa8de; --l2:#b690dc; --l3:#e0a24d; --l4:#4cc3c8; --l5:#9aa3a9; --l6:#f0a07c; --l7:#97a3f0;
  --k-prop:#3f7fb5; --k-field:#6f777d; --k-const:#8d62b8; --k-event:#a8701e; --k-meth:#2a8a5c; --k-ctor:#1f8f94;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --surface2:#1f2d25; --ink:#e5eee8; --muted:#94a69b; --line:#2b3b32;
  --accent:#4fbf89; --on-accent:#0b1410; --imp:#f0913f; --use:#4fbf89; --ok:#4fbf89; --warn:#e3b72b; --bad:#ef7a68;
  --code-bg:#121b16; --sk:#c39be0; --ss:#f0a07c; --sc:#7f9186; --sn:#7fb8e8; --st:#6fd3a0;
  --hl-t:#1a2a21; --hl-m:#4a4210;
  --l0:#4fbf89; --l1:#6aa8de; --l2:#b690dc; --l3:#e0a24d; --l4:#4cc3c8; --l5:#9aa3a9; --l6:#f0a07c; --l7:#97a3f0;
  --k-prop:#3f7fb5; --k-field:#6f777d; --k-const:#8d62b8; --k-event:#a8701e; --k-meth:#2a8a5c; --k-ctor:#1f8f94;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;border-bottom:3px solid var(--yellow);margin-bottom:12px}
.brand{font:700 20px/1 var(--f-d);letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand b{color:var(--accent)} .brand small{font:500 12px var(--f-b);color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;display:flex;flex-direction:column;text-align:left;min-width:0}
.tab span{font:600 14px var(--f-d)} .tab small{color:var(--muted);font-size:11px}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .tab[aria-selected=true] small{color:inherit;opacity:.85}
.note{margin-left:auto;font-size:12px;color:var(--muted);max-width:440px}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;font-size:12px}
h2,h3{font-family:var(--f-d);margin:0;text-wrap:balance}
.mono{font-family:var(--f-m);font-size:12px}
.mono,.code,.tr.l4,.tbl-name b,.chip,svg text{font-variant-ligatures:none!important;font-feature-settings:'calt' 0,'liga' 0!important}
.code *{font-variant-ligatures:none!important;font-feature-settings:'calt' 0,'liga' 0!important}
.tbl-name b{white-space:nowrap}.init{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.td-type{white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--surface2);white-space:nowrap}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:2px 8px;margin:0 4px 4px 0;font:500 12px var(--f-m);background:var(--surface);cursor:pointer;text-decoration:none;max-width:100%}
.chip:hover{border-color:var(--accent)}
.chip.imp{border-left:4px solid var(--imp)} .chip.use{border-left:4px solid var(--use)}
.chip i{font-style:normal;color:var(--muted);font-size:10px}
.sec{font:600 11px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.tile b{display:block;font:700 20px/1.1 var(--f-d);font-variant-numeric:tabular-nums} .tile small{color:var(--muted);font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%} th{font:600 11px var(--f-b);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-s]{cursor:pointer}
th[title]{cursor:help;text-decoration:underline dotted;text-underline-offset:3px}

td{padding:5px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top} tbody tr:hover{background:var(--surface2)}
tr[data-ml]{cursor:pointer} tr.cur{background:var(--hl-m)}
.bar{display:inline-block;height:6px;border-radius:3px;background:currentColor;vertical-align:middle;min-width:2px}
.scroll{overflow:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 9px;font-size:12px} .btn:hover{border-color:var(--accent)}
/* Einklappbare Abschnitte im Detailbereich */
details.fold{border-top:1px solid var(--line);margin-top:12px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 2px 7px;font:600 11px var(--f-b);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▶';font-size:9px;width:10px;transition:transform .12s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary:hover{color:var(--ink)}
details.fold>summary .cnt{font:600 11px var(--f-m);color:var(--ink);text-transform:none;letter-spacing:0}
details.fold>summary .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.fold-body{padding-bottom:6px}
.mk{display:inline-block;width:15px;height:15px;border-radius:3px;font:700 9px/15px var(--f-m);text-align:center;color:#fff;flex:none;vertical-align:1px}
/* Quelltext */
.src{display:flex;flex-direction:column;min-height:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.src-h{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--surface);font:12px var(--f-m);flex-wrap:wrap}
.code{overflow:auto;position:relative;flex:1;min-height:160px;font:12px/1.55 var(--f-m);padding-block:6px}
.ln{display:grid;grid-template-columns:48px 1fr;min-width:max-content} .ln b{font-weight:400;color:var(--sc);text-align:right;padding-right:12px;user-select:none;opacity:.7} .ln>span{white-space:pre;padding-right:16px}
.ln.it{background:var(--hl-t)} .ln.im{background:var(--hl-m)}
.k{color:var(--sk)} .s{color:var(--ss)} .c{color:var(--sc);font-style:italic} .n{color:var(--sn)} .tl{color:var(--st);cursor:pointer;text-decoration:none} .tl:hover{text-decoration:underline}
.empty{display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px;min-height:120px}
/* Explorer */
.va{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1.1fr) minmax(0,1.15fr);gap:12px;height:calc(100vh - 110px);min-height:520px}
.va>*{min-height:0;min-width:0}
.tree{display:flex;flex-direction:column;overflow:hidden}
.srch{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:9px 12px;font:13px var(--f-b);outline-offset:-2px}
.tree-tools{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tree-b{overflow:auto;flex:1;padding:4px 0}
.tr{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-size:13px;outline-offset:-2px}
.tr:hover{background:var(--surface2)} .tr.sel{background:var(--hl-m)}
.tr .car{width:16px;height:16px;display:inline-grid;place-items:center;color:var(--muted);font-size:9px;flex:none;border-radius:3px}
.tr .car:hover{background:var(--line);color:var(--ink)}
.tr .car.none{visibility:hidden}
.tr .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.tr .r{color:var(--muted);font:11px var(--f-m)}
.tr.l0{font:600 13px var(--f-d);padding-top:6px} .tr.l1{padding-left:20px;color:var(--muted)} .tr.l2{padding-left:34px}
.tr.l3{padding-left:52px;font:600 10px var(--f-b);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tr.l4{padding-left:72px;font:12px var(--f-m)}
.tr.l4 .ty{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.ki{display:inline-block;vertical-align:middle;width:16px;height:16px;border-radius:3px;font:700 10px/16px var(--f-m);text-align:center;color:#fff;flex:none}
.det{overflow:auto;padding:14px 16px}
.det h2{font-size:26px;overflow-wrap:anywhere} .sub{font:12px var(--f-m);color:var(--muted);overflow-wrap:anywhere}
.tbl-name b{font-family:var(--f-m);font-size:12.5px}
.tbl-doc{color:var(--muted);font-size:12px;max-width:420px}
/* Abhängigkeiten */
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-right:1px solid var(--line);font-size:12px} .seg button:last-child{border:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.legend{display:flex;align-items:center;gap:6px 16px;font-size:11px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:3px solid;vertical-align:middle}
svg text{font-family:var(--f-m);font-size:11px;fill:var(--ink)}
.gv{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px;align-items:start}
.gv details{border-bottom:1px solid var(--line);padding:3px 0} .gv summary{cursor:pointer;font-size:13px} .gv .pairs{padding:4px 0 6px 16px}
@media (max-width:1000px){
  .va{grid-template-columns:minmax(0,1fr);height:auto} .va .tree{max-height:360px} .va .src{height:480px}
  .gv{grid-template-columns:minmax(0,1fr)} .note{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>__TITLE__</b> Code-Dokumentation <small id="ver"></small></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="note" id="note"></div>
  <button class="themebtn" id="theme" title="Hell/Dunkel umschalten">◐</button>
</header>
<main id="app"></main>
<script type="application/json" id="data">{"__DATA__":1}</script>
<script type="application/json" id="files">{"__FILES__":1}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),F=JSON.parse(document.getElementById('files').textContent);
const META=D.meta,T=D.types,byId={},byName={},users={};
T.forEach(t=>{t.props=t.props||[];byId[t.id]=t;(byName[t.name]=byName[t.name]||[]).push(t)});
T.forEach(t=>t.deps.forEach(d=>(users[d]=users[d]||[]).push(t.id)));
const PFX=META.prefix||'';
const strip=s=>PFX&&s.startsWith(PFX)?s.slice(PFX.length):s;
const lay=t=>strip(t.project),nsS=strip,sn=id=>byId[id]?byId[id].name:id.split('|')[1];
const LAYERS=META.layers&&META.layers.length?META.layers:[...new Set(T.map(lay))];
const lc=L=>`var(--l${Math.max(0,LAYERS.indexOf(L))%8})`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const miOf=(loc,cc)=>Math.round(Math.max(0,(171-5.2*Math.log(Math.max(1,loc*8))-.23*cc-16.2*Math.log(Math.max(1,loc)))*100/171));
T.forEach(t=>t.meths.forEach(m=>m.mi=miOf(m.loc,m.cc)));
const ccC=c=>c>10?'bad':c>5?'warn':'ok', miC=m=>m>=55?'ok':m>=35?'warn':'bad', inC=i=>i>.8?'bad':i>.5?'warn':'ok';
const KI={class:['C','#2c6fa3'],interface:['I','#8553ad'],record:['R','#b8741a'],struct:['S','#17878c'],enum:['E','#6f777d']};
const kiHtml=t=>{const k=KI[t.kind]||KI.class;return `<span class="ki" style="background:${k[1]}" title="${t.kind}">${k[0]}</span>`};
/* Member-Arten: Kürzel, Farbe, Beschriftung, Sortierung */
const MK={param:['P','prop','Record-Parameter',0],property:['P','prop','Property',1],indexer:['P','prop','Indexer',2],event:['E','event','Ereignis',3],field:['F','field','Feld',4],const:['K','const','Konstante',5],enum:['W','const','Enum-Wert',6],method:['M','meth','Methode',7],ctor:['C','ctor','Konstruktor',7]};
const mkHtml=k=>{const x=MK[k]||MK.field;return `<span class="mk" style="background:var(--k-${x[1]})" title="${x[2]}">${x[0]}</span>`};
const isProp=p=>p.kind==='param'||p.kind==='property'||p.kind==='indexer';
const pick=w=>byName[w][0];
const typeLink=id=>`<a class="chip" data-go="${id}">${esc(sn(id))}</a>`;
const propsOf=t=>t.props.slice().sort((a,b)=>(MK[a.kind]||MK.field)[3]-(MK[b.kind]||MK.field)[3]||a.l-b.l);
const methsOf=t=>t.meths.slice().sort((a,b)=>a.l-b.l);

/* ---------- Syntaxhervorhebung (C#) ---------- */
const KW=new Set('abstract as async await base bool break case catch char checked class const continue decimal default delegate do double else enum event explicit extern false finally fixed float for foreach goto if implicit in int interface internal is lock long namespace new null object operator out override params private protected public readonly record ref return sealed short sizeof static string struct switch this throw true try typeof uint ulong unchecked unsafe ushort using var virtual void volatile while when init required with get set yield partial global nint not and or file'.split(' '));
const hlc={};
function hlFile(p){
  if(hlc[p])return hlc[p];
  const src=F[p]||'',re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(\$?@?"(?:\\.|[^"\\\n])*"|@\$?"(?:[^"]|"")*"|'(?:\\.|[^'\\\n])')|(\b\d[\d_]*(?:\.\d+)?[fFdDmMlLuU]*\b)|([A-Za-z_]\w*)/g;
  const wrap=(c,s)=>s.split('\n').map(x=>`<span class="${c}">${esc(x)}</span>`).join('\n');
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));last=re.lastIndex;
    if(m[1])out+=wrap('c',m[1]);else if(m[2])out+=wrap('s',m[2]);else if(m[3])out+=wrap('n',m[3]);
    else{const w=m[4];out+=KW.has(w)?`<span class="k">${w}</span>`:(byName[w]&&/^[A-Z]/.test(w))?`<a class="tl" data-go="${pick(w).id}">${w}</a>`:w}
  }
  out+=esc(src.slice(last));return hlc[p]=out.split('\n');
}
function srcView(el,t,mem){
  if(!t){el.innerHTML='<div class="empty">Typ, Property oder Methode wählen, dann erscheint hier der Quelltext.</div>';return}
  const L=hlFile(t.file);
  const what=mem?`${(MK[mem.kind]||MK.method)[2]} ${esc(mem.n)} · Zeilen ${mem.l}–${mem.e}`:`Typ ${esc(t.name)} · Zeilen ${t.l}–${t.e}`;
  el.innerHTML=`<div class="src-h"><span>${esc(t.file)}</span><span class="muted">${what}</span></div><div class="code">`+
   L.map((h,i)=>{const n=i+1;return `<div class="ln${n>=t.l&&n<=t.e?' it':''}${mem&&n>=mem.l&&n<=mem.e?' im':''}"><b>${n}</b><span>${h||' '}</span></div>`}).join('')+'</div>';
  const code=el.querySelector('.code'),tgt=(mem?mem.l:t.dl)-1;
  code.scrollTop=Math.max(0,(code.children[Math.max(0,tgt)]?.offsetTop||0)-30);
}

/* ---------- Bausteine Detailbereich ---------- */
function metricTiles(t){
  const np=t.props.filter(isProp).length,nf=t.props.length-np;
  return `<div class="tiles"><div class="tile"><b>${t.loc}</b><small>Codezeilen</small></div><div class="tile"><b class="${ccC(t.cc/Math.max(1,t.meths.length))}">${t.cc}</b><small>Komplexität (Σ CC)</small></div>
  <div class="tile"><b class="${miC(t.mi)}">${t.mi}</b><small>Wartbarkeit (0–100)</small></div><div class="tile"><b>${np}</b><small>Properties</small></div><div class="tile"><b>${nf}</b><small>Felder u. a.</small></div><div class="tile"><b>${t.meths.length}</b><small>Methoden</small></div>
  <div class="tile"><b>${t.ce}</b><small>nutzt (Ce)</small></div><div class="tile"><b>${t.ca}</b><small>genutzt von (Ca)</small></div>
  <div class="tile"><b class="${inC(t.instab)}">${t.instab.toFixed(2)}</b><small>Instabilität</small></div>${t.tested===null||t.tested===undefined?'<div class="tile"><b class="muted">–</b><small>Tests nicht gescannt</small></div>':`<div class="tile"><b class="${t.tested?'ok':'bad'}">${t.tested?'ja':'nein'}</b><small>Test nennt Typ</small></div>`}</div>`;
}
function depChips(t){
  const u=(users[t.id]||[]).slice().sort(),imp=t.deps.slice().sort();
  const grp=(ids,c)=>ids.length?ids.map(i=>`<a class="chip ${c}" data-go="${i}" title="${esc(byId[i].ns)}">${esc(sn(i))}<i>${esc(lay(byId[i]))}</i></a>`).join(''):'<span class="muted">keine</span>';
  return `<div class="sec">Nutzt (${imp.length})</div><div>${grp(imp,'imp')}</div><div class="sec">Wird genutzt von (${u.length})</div><div>${grp(u,'use')}</div>`;
}
function propTable(t,cur){
  const ps=propsOf(t);
  if(!ps.length)return '<p class="muted">Keine Properties oder Felder gefunden.</p>';
  return `<div class="scroll"><table><thead><tr><th>Name</th><th>Typ</th><th>Art</th><th>Zugriff</th><th>Zeilen</th></tr></thead><tbody>${ps.map(p=>`<tr data-ml="${p.l}" data-mk="p" data-mn="${esc(p.n)}" class="${cur&&cur.l===p.l&&cur.n===p.n?'cur':''}"><td class="tbl-name">${mkHtml(p.kind)}&nbsp;<b>${esc(p.n)}</b>${p.static&&p.kind!=='const'&&p.kind!=='enum'?' <span class="pill">static</span>':''}${p.doc?`<div class="tbl-doc">${esc(p.doc)}</div>`:''}${p.init?`<div class="mono muted init" title="${esc(p.init)}">= ${esc(p.init)}</div>`:''}</td><td class="mono td-type" title="${esc(p.type)}">${esc(p.type)}</td><td>${(MK[p.kind]||MK.field)[2]}<div class="muted" style="font-size:12px">${esc(p.vis)}</div></td><td class="mono">${esc(p.acc||'')}</td><td class="mono muted">${p.l===p.e?p.l:p.l+'–'+p.e}</td></tr>`).join('')}</tbody></table></div>`;
}

  if(G.all)EL.forEach(e=>{svg+=`<path d="${path(e)}" fill="none" stroke="var(--muted)" stroke-width="${Math.min(3,.6+Math.sqrt(e.pairs.length)*.4)}" opacity=".16"/>`});
  EL.forEach(e=>{if(e.a!==sel&&e.b!==sel)return;const o=e.a===sel;svg+=`<path d="${path(e)}" fill="none" stroke="${o?'var(--imp)':'var(--use)'}" stroke-width="${1.2+Math.sqrt(e.pairs.length)*.7}" opacity=".85" marker-end="url(#${o?'ao':'au'})" ${cyc(e)?'stroke-dasharray="5 3"':''}><title>${esc(nsS(e.a))} → ${esc(nsS(e.b))}: ${e.pairs.length} Verweise</title></path>`});
  Object.keys(NS).forEach(k=>{const p=pos[k],n=NS[k],dim=!nb.has(k),lab=nsS(k).replace(n.L+'.','');
    svg+=`<g data-nsn="${esc(k)}" style="cursor:pointer" opacity="${dim?.4:1}"><title>${esc(nsS(k))} · ${n.ts.length} Typen · ${n.loc} LOC</title><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="5" fill="var(--surface)" stroke="${k===sel?'var(--yellow)':lc(n.L)}" stroke-width="${k===sel?3:1.3}"/><text x="${p.x+8}" y="${p.y+17}">${esc(lab.length>24?lab.slice(0,23)+'…':lab)}</text><text x="${p.x+NW-8}" y="${p.y+17}" text-anchor="end" style="fill:var(--muted)">${n.ts.length}</text></g>`});
  wrap.innerHTML=svg+'</svg>';
  wrap.onclick=e=>{const g=e.target.closest('[data-nsn]');if(g){G.ns=g.dataset.nsn;G.drawNs()}};
  const nc=EL.filter(e=>cyc(e)&&e.a<e.b).length,nv=EL.filter(viol).length;
  document.getElementById('gctl').innerHTML=`<label class="muted"><input type="checkbox" id="gall" ${G.all?'checked':''}> alle Verbindungen schwach einblenden</label>`;
  document.getElementById('gall').onchange=e=>{G.all=e.target.checked;G.drawNs()};
  document.getElementById('gleg').innerHTML=`<span><span class="sw" style="border-color:var(--imp)"></span> Auswahl nutzt</span><span><span class="sw" style="border-color:var(--use)"></span> nutzt die Auswahl</span><span>gestrichelt = gegenseitig (Zyklus)</span><span>Zahl im Kasten = Typen</span><span>Gesamt: ${Object.keys(NS).length} Namespaces, ${EL.length} Verbindungen, ${nc} gegenseitige Paare, ${nv} Verbindungen entgegen der Schichtung</span>`;
  G.panelNs();
 },
 panelNs(){
  const n=NS[G.ns],o=(OUT[G.ns]||[]).slice().sort((a,b)=>b.pairs.length-a.pairs.length),i=(INN[G.ns]||[]).slice().sort((a,b)=>b.pairs.length-a.pairs.length);
  const row=(e,other,cls)=>`<details><summary><span class="dot" style="color:${lc(NS[other].L)}"></span> ${esc(nsS(other))} <b>${e.pairs.length}</b>${cyc(e)?' <span class="pill bad">Zyklus</span>':''}${viol(e)?' <span class="pill warn">gegen Schichtung</span>':''}</summary><div class="pairs">${e.pairs.slice(0,40).map(p=>`<div class="mono"><a data-focus="${p[0]}" class="chip ${cls}">${esc(sn(p[0]))}</a> → <a data-focus="${p[1]}" class="chip ${cls}">${esc(sn(p[1]))}</a></div>`).join('')}${e.pairs.length>40?`<div class="muted">… und ${e.pairs.length-40} weitere</div>`:''}</div></details>`;
  const inst=(o.length+i.length)?o.length/(o.length+i.length):0;
  const el=document.getElementById('gpanel');
  el.innerHTML=`<div class="sub">${esc(n.L)}</div><h3 style="font-size:22px;overflow-wrap:anywhere">${esc(nsS(n.ns))}</h3>
   <div class="tiles" style="margin-top:8px"><div class="tile"><b>${n.ts.length}</b><small>Typen</small></div><div class="tile"><b>${n.loc}</b><small>Codezeilen</small></div><div class="tile"><b>${o.length}</b><small>nutzt Namespaces</small></div><div class="tile"><b>${i.length}</b><small>genutzt von</small></div><div class="tile"><b class="${inC(inst)}">${inst.toFixed(2)}</b><small>Instabilität</small></div></div>
   <div class="sec" style="color:var(--imp)">Nutzt (${o.length}) – aufklappen zeigt die Typpaare</div>${o.map(e=>row(e,e.b,'imp')).join('')||'<span class="muted">keine</span>'}
   <div class="sec" style="color:var(--use)">Wird genutzt von (${i.length})</div>${i.map(e=>row(e,e.a,'use')).join('')||'<span class="muted">keine</span>'}
   <div class="sec">Typen (${n.ts.length})</div><div>${n.ts.slice().sort((a,b)=>b.loc-a.loc).map(t=>`<a class="chip" data-focus="${t.id}">${esc(t.name)}</a>`).join('')}</div>`;
  el.onclick=e=>{const f=e.target.closest('[data-focus]');if(f){e.preventDefault();G.focus=f.dataset.focus;G.mode='type';G.render(document.getElementById('app'))}};
 },
 drawType(){
  const wrap=document.getElementById('gsvg'),f=byId[G.focus],max=30;
  const cols={0:[f.id]},seen=new Set([f.id]);
  const grow=(from,dir)=>{const r=[];from.forEach(id=>(dir<0?users[id]||[]:byId[id].deps).forEach(x=>{if(!seen.has(x)){seen.add(x);r.push(x)}}));return r.sort()};
  cols[-1]=grow([f.id],-1);cols[1]=grow([f.id],1);
  if(G.depth>1){cols[-2]=grow(cols[-1],-1);cols[2]=grow(cols[1],1)}
  const cs=G.depth>1?[-2,-1,0,1,2]:[-1,0,1],NW=164,GX=56,R=26,rows=Math.max(...cs.map(c=>Math.min(max+1,(cols[c]||[]).length)),1),H=rows*R+50,W=cs.length*NW+(cs.length-1)*GX+20;
  const xs=c=>10+cs.indexOf(c)*(NW+GX),ys=(c,i)=>40+i*R,P={};
  cs.forEach(c=>(cols[c]||[]).slice(0,max).forEach((id,i)=>P[id]={c,x:xs(c),y:ys(c,i)}));
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Typ-Abhängigkeiten">`;
  const names={'-2':'Nutzer der Nutzer','-1':'Nutzt den Typ','0':'Fokus','1':'Wird genutzt','2':'Abhängigkeiten der Abhängigkeiten'};
  cs.forEach(c=>{const n=(cols[c]||[]).length;svg+=`<text x="${xs(c)}" y="16" style="fill:var(--muted);font-weight:600">${names[c]} (${n})</text>`;if(n>max)svg+=`<text x="${xs(c)}" y="${H-6}" style="fill:var(--muted)">+ ${n-max} weitere</text>`});
  Object.keys(P).forEach(a=>byId[a].deps.forEach(b=>{if(!P[b]||P[b].c!==P[a].c+1)return;const A_=P[a],B_=P[b],x1=A_.x+NW,y1=A_.y+11,x2=B_.x,y2=B_.y+11,m=(x1+x2)/2,foc=a===f.id||b===f.id,col=b===f.id?'var(--use)':a===f.id?'var(--imp)':'var(--muted)';
    svg+=`<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${foc?1.8:1}" opacity="${foc?.75:.3}"/>`}));
  Object.entries(P).forEach(([id,p])=>{const t=byId[id],isf=id===f.id;svg+=`<g data-fo="${id}" style="cursor:pointer"><title>${esc(t.ns)}</title><rect x="${p.x}" y="${p.y}" width="${NW}" height="22" rx="4" fill="${isf?'var(--accent)':'var(--surface)'}" stroke="${lc(lay(t))}" stroke-width="1.5"/><text x="${p.x+8}" y="${p.y+15}" style="${isf?'fill:var(--on-accent);font-weight:600':''}">${esc(t.name.length>24?t.name.slice(0,23)+'…':t.name)}</text></g>`});
  wrap.innerHTML=svg+'</svg>';
  wrap.onclick=e=>{const g=e.target.closest('[data-fo]');if(g){G.focus=g.dataset.fo;G.drawType()}};
  document.getElementById('gctl').innerHTML=`<input class="srch card" id="gq" list="gdl" style="width:230px;border-radius:6px" placeholder="Typ wählen …" value="${esc(f.name)}"><datalist id="gdl">${T.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist> <div class="seg" id="gdep"><button data-d="1" aria-pressed="${G.depth===1}">1 Stufe</button><button data-d="2" aria-pressed="${G.depth===2}">2 Stufen</button></div>`;
  document.getElementById('gq').onchange=e=>{const t=byName[e.target.value];if(t){G.focus=t[0].id;G.drawType()}};
  document.getElementById('gdep').onclick=e=>{const b=e.target.closest('[data-d]');if(b){G.depth=+b.dataset.d;G.drawType()}};
  document.getElementById('gleg').innerHTML=`<span><span class="sw" style="border-color:var(--use)"></span> nutzen den Typ</span><span><span class="sw" style="border-color:var(--imp)"></span> vom Typ genutzt</span><span>Kastenrand = Schicht. Klick auf einen Kasten setzt ihn in den Fokus.</span>`;
  document.getElementById('gpanel').innerHTML=`<div class="sub">${esc(nsS(f.ns))} · ${esc(lay(f))}</div><h3 style="font-size:22px">${esc(f.name)} <span class="pill">${f.kind}</span></h3>${f.doc?`<p>${esc(f.doc)}</p>`:''}${metricTiles(f)}<p><button class="btn" data-open="${f.id}" style="margin-top:10px">Im Explorer öffnen</button> <button class="btn" data-nsjump="${esc(f.ns)}">Namespace im Graph</button></p>${depChips(f).replace(/data-go=/g,'data-fo2=')}`;
  document.getElementById('gpanel').onclick=e=>{const o=e.target.closest('[data-open]');if(o){S.id=o.dataset.open;S.mem=null;S.group=null;A.reveal(S.id);location.hash='explorer';return}const j=e.target.closest('[data-nsjump]');if(j){G.ns=j.dataset.nsjump;G.mode='ns';G.render(document.getElementById('app'));return}const c=e.target.closest('[data-fo2]');if(c){e.preventDefault();G.focus=c.dataset.fo2;G.drawType()}};
 }};

/* Kurzbeschreibung als Hover-Text für jeden Tabellenkopf */
const TH_TIPS={
 'Name':'Name des Members, darunter Doku-Kommentar und Initialwert',
 'Typ':'Datentyp bzw. Typname, wie im Quelltext geschrieben',
 'Typen':'Anzahl der Klassen, Interfaces, Records, Structs und Enums',
 'Art':'Art des Members (Property, Feld, Konstante, Ereignis …), darunter die Sichtbarkeit',
 'Zugriff':'Accessoren: get, set, init; „get (=>)“ = berechnet; readonly = nur im Konstruktor setzbar',
 'Zeilen':'Zeilenbereich in der Quelldatei; Klick auf die Zeile zeigt den Quelltext',
 'Methode':'Name und Signatur der Methode, darunter der Doku-Kommentar',
 'Methoden':'Anzahl der Methoden und Konstruktoren',
 'Meth.':'Anzahl der Methoden und Konstruktoren',
 'Sichtbar':'Sichtbarkeit: public, internal, protected oder private',
 'LOC':'Lines of Code: Codezeilen ohne Leer- und reine Kommentarzeilen',
 'CC':'Zyklomatische Komplexität: Anzahl unabhängiger Pfade. Bis 5 gut, bis 10 mittel, darüber schwer zu testen',
 'MI':'Wartbarkeitsindex 0–100 aus Codezeilen und Komplexität. Ab 55 gut, ab 35 mittel, darunter schlecht',
 'Ce':'Efferente Kopplung: Anzahl der Typen, die dieser Typ nutzt',
 'Ca':'Afferente Kopplung: Anzahl der Typen, die diesen Typ nutzen',
 'Props':'Anzahl der Properties und Felder',
 'Properties':'Anzahl der Properties (ohne Felder und Konstanten)',
 'Test':'Ob ein Test den Typnamen nennt (keine Abdeckungsmessung)',
 'Schicht':'Projekt bzw. Architekturschicht',
 'Namespaces':'Anzahl der Namespaces in der Schicht'};
new MutationObserver(()=>document.querySelectorAll('th:not([title])').forEach(th=>{const t=TH_TIPS[th.textContent.trim()];if(t)th.title=t+(th.dataset.s?' · Klick sortiert':'')})).observe(document.getElementById('app'),{childList:true,subtree:true});
/* ===== Start ===== */
const V={explorer:A,map:G},NAMES={explorer:['Explorer','Namespaces, Klassen, Properties, Methoden'],map:['Abhängigkeiten','Karte der Verbindungen']};
function show(k){if(!V[k])k='explorer';cur=k;
  document.getElementById('tabs').innerHTML=Object.entries(NAMES).map(([i,n])=>`<button class="tab" role="tab" aria-selected="${i===k}" data-v="${i}"><span>${n[0]}</span><small>${n[1]}</small></button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});
  V[k].render(document.getElementById('app'))}
document.getElementById('ver').textContent=[META.version&&'Stand '+META.version,META.generated&&'erzeugt '+META.generated].filter(Boolean).join(' · ');
document.getElementById('note').textContent=`Aus dem Quelltext erzeugt: ${T.length} Typen, ${T.reduce((s,t)=>s+t.props.length,0)} Properties/Felder, ${T.reduce((s,t)=>s+t.meths.length,0)} Methoden. Kennzahlen sind Näherungen eines Quelltext-Scanners, keine Compiler-Analyse.`;
document.getElementById('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
addEventListener('hashchange',()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||'explorer');
</script>
